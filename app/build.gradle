plugins {
    id 'com.android.application'
}

android {
    namespace 'com.giryong.morningword'
    compileSdk 34

    // 업데이트할 때 같은 앱으로 인식되도록 서명 도장을 고정한다.
    signingConfigs {
        fixed {
            storeFile file('morningword.keystore')
            storePassword 'morning2026'
            keyAlias 'morningword'
            keyPassword 'morning2026'
        }
    }

    defaultConfig {
        applicationId 'com.giryong.morningword'
        minSdk 26
        targetSdk 34
        versionCode 3
        versionName '1.2'
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.fixed
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}
